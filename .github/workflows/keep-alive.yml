name: Dual Render 24x7 Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Amit Academy Backend & OpenWA Bridge
        run: |
          curl -fsS --max-time 25 https://amit-academy-backend.onrender.com/api/health || true
          echo ""
          curl -fsS --max-time 25 https://amit-academy-openwa-bridge.onrender.com/health || true
          echo ""
