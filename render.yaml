services:
  - type: web
    name: academy-crm-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        value: https://your-academy.pages.dev,http://localhost:3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: openwa
      - key: OPENWA_API_URL
        sync: false
      - key: OPENWA_API_KEY
        sync: false
      - key: WHATSAPP_LINKED_DEVICE_URL
        sync: false
      - key: WHATSAPP_LINKED_DEVICE_TOKEN
        sync: false
      - key: WHATSAPP_DAILY_LIMIT
        value: "100"
      - key: DEV_ADMIN_EMAIL
        sync: false
      - key: DEV_ADMIN_PASSWORD
        sync: false
      - key: DEV_TEACHER_EMAIL
        sync: false
      - key: DEV_TEACHER_PASSWORD
        sync: false
